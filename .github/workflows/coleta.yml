name: Coleta de mercado

# Roda sozinho a cada 5 minutos - o intervalo minimo que o GitHub aceita.
# O disparo e por ordem de chegada: quando a fila esta cheia, ele atrasa alguns
# minutos. Nao e problema aqui, porque cada execucao busca a ultima vela
# fechada e o arquivo ignora o que ja foi gravado; atraso vira, no maximo,
# algumas velas coletadas juntas depois.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pares:
        description: "Pares, separados por virgula"
        default: "BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT"
      timeframes:
        description: "Timeframes (o agendador nao alcanca 1m)"
        default: "5m,15m,1h"

# Impede duas execucoes gravando no mesmo arquivo ao mesmo tempo, o que daria
# conflito no push. A que estiver rodando termina; a nova espera.
concurrency:
  group: coleta-mercado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Mesma versao do ambiente de desenvolvimento, de proposito: o motor
          # de backtest e o coletor precisam produzir numeros identicos, e
          # divergencia de versao e uma fonte silenciosa de diferenca.
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        # SEM --no-cache-dir: `cache: pip` acima guarda /home/runner/.cache/pip
        # entre execucoes, e instalar sem cache deixa essa pasta vazia. O passo
        # de encerramento do setup-python entao nao acha o que salvar e derruba
        # a execucao inteira - mesmo com a coleta ja concluida e commitada.
        run: pip install -r requirements.txt

      - name: Coletar
        env:
          TZ: UTC
          # Explicito de proposito. O runner do GitHub roda em datacenter, e a
          # Binance recusa faixas de nuvem com 451 "restricted location" - de
          # forma intermitente, o que daria falha aleatoria numa coleta 24/7.
          EXCHANGE: okx
          # Banco descartavel: o runner e recriado a cada execucao. A memoria
          # que atravessa execucoes e o arquivo JSONL versionado.
          BANCO_DADOS: ${{ runner.temp }}/efemero.db
        run: |
          python cli.py monitorar \
            --pares "${{ inputs.pares || 'BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT' }}" \
            --tfs "${{ inputs.timeframes || '5m,15m,1h' }}" \
            --estrategia todas \
            --ciclos 1 \
            --jsonl dados/observacoes \
            --banco "$BANCO_DADOS"

      - name: Gravar no repositorio
        run: |
          git config user.name  "coletor-de-mercado"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/observacoes

          if git diff --cached --quiet; then
            echo "Nenhuma vela nova fechou desde a ultima execucao."
            exit 0
          fi

          git commit -m "dados: coleta de $(date -u +'%Y-%m-%d %H:%M') UTC"

          # Rebase antes do push: uma execucao manual pode ter commitado no
          # meio do caminho. Tres tentativas cobrem a corrida sem mascarar um
          # problema de verdade.
          for tentativa in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "tentativa $tentativa falhou, repetindo"
            sleep 5
          done
          exit 1
